<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visitor stats · JunHotS</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/site.css" />
    <style>
      /* Jun's visitor stats: who comes back and which pages send people to Twitch (src/stats.js). Only after Jun login. */
      .seg {
        display: inline-flex;
        padding: 3px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .seg button {
        font: 500 13px var(--sans);
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button[aria-pressed="true"] {
        background: var(--surface-2);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .head-side {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .ghost {
        font: 500 13px var(--sans);
        color: var(--muted);
        background: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        text-decoration: none;
      }
      .ghost:hover {
        color: var(--text);
        border-color: #4a413c;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .tile {
        padding: 16px 16px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .tile b {
        display: block;
        font: 600 28px/1.1 var(--display);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .tile span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .tile small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: #7d736d;
      }
      .tile.tw b {
        color: #b98bff;
      }

      .box {
        margin-bottom: 14px;
        padding: 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .box h2 {
        margin: 0 0 4px;
        font: 600 16px var(--display);
      }
      .box p.sub {
        margin: 0 0 14px;
        font-size: 13px;
        color: var(--muted);
      }
      /* Visitors per day: returning (coral) on the bottom, new (grey) on top; Twitch clicks as a number under each day */
      .days {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 150px;
      }
      .day {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 2px;
      }
      .day i {
        display: block;
        border-radius: 3px 3px 1px 1px;
        min-height: 0;
      }
      .day .nw {
        background: #4a413c;
      }
      .day .rt {
        background: var(--brand);
        border-radius: 1px;
      }
      .day:hover i {
        filter: brightness(1.25);
      }
      .daylab {
        display: flex;
        gap: 3px;
        margin-top: 6px;
        font: 11px var(--mono);
        color: #7d736d;
      }
      .daylab span {
        flex: 1;
        min-width: 0;
        text-align: center;
        overflow: hidden;
      }
      .key {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .key i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        font: 500 12px var(--sans);
        color: var(--muted);
        padding: 0 10px 8px 0;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 9px 10px 9px 0;
        border-bottom: 1px solid #262220;
        font-variant-numeric: tabular-nums;
      }
      th.n,
      td.n {
        text-align: right;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td .bar {
        display: inline-block;
        height: 6px;
        border-radius: 3px;
        background: #9146ff;
        vertical-align: middle;
        margin-right: 8px;
      }
      td.rate {
        color: #b98bff;
        font-weight: 500;
      }
      .note {
        font-size: 12.5px;
        color: #7d736d;
        margin: 4px 0 40px;
      }
      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .empty b {
        display: block;
        color: var(--text);
        font: 600 16px var(--display);
        margin-bottom: 4px;
      }

      .login {
        max-width: 360px;
        margin: 24px 0;
        display: grid;
        gap: 10px;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .login input {
        height: 40px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font: 14px var(--sans);
        padding: 0 12px;
        outline: none;
      }
      .login input:focus {
        border-color: var(--brand);
      }
      .login button {
        height: 38px;
        border-radius: 9px;
        border: 0;
        background: var(--brand);
        color: #1a0f0b;
        font: 600 14px var(--sans);
        cursor: pointer;
      }
      .login .err {
        margin: 0;
        color: var(--bad);
        font-size: 13px;
      }
      @media (max-width: 640px) {
        .hide-sm {
          display: none;
        }
      }
    </style>
    <script src="/nav.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <nav>
        <a class="logo" href="/">Jun<span>HotS</span></a>
        <div class="tabs">
          <a href="/">Home</a><a href="/tierlist/">Tier list</a><a href="/builds/">Builds</a><a href="/draft/">Draft</a
          ><a href="/patch-notes/">Patch notes</a><a href="/tierlist-maker/">Make your own</a
          ><a href="/overlay/">Overlay</a>
        </div>
        <a class="nav-live" href="https://www.twitch.tv/junhots_" target="_blank" rel="noopener"
          ><span class="dot"></span>Twitch</a
        >
      </nav>

      <header class="page-head">
        <div>
          <h1>Visitor stats</h1>
          <p class="sub">Who comes back, and which pages send people to Twitch. Only you can see this page.</p>
        </div>
        <div class="head-side" id="side" hidden>
          <div class="seg" role="group" aria-label="Days">
            <button type="button" data-d="7" aria-pressed="false">7 days</button>
            <button type="button" data-d="30" aria-pressed="true">30 days</button>
            <button type="button" data-d="90" aria-pressed="false">90 days</button>
          </div>
          <a class="ghost" href="/inbox/">Inbox</a>
          <a class="ghost" href="/backups/">Backups</a>
        </div>
      </header>

      <form class="login" id="login" hidden>
        <b>Jun login</b>
        <input
          type="password"
          id="pw"
          placeholder="Website password"
          autocomplete="current-password"
          aria-label="Website password"
        />
        <p class="err" id="pwerr" hidden>Wrong password.</p>
        <button type="submit">Open stats</button>
      </form>
      <div id="out"></div>

      <footer>
        <span>© 2026 Jun · junhots.com</span>
        <span class="social"><a href="/updates/">Updates</a><a href="/inbox/">Inbox</a></span>
        <span>Not affiliated with Blizzard Entertainment</span>
      </footer>
    </div>

    <script>
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const PAGE = {
        home: "Home",
        tierlist: "Tier list",
        builds: "Builds (hero list)",
        hero: "Builds (a hero)",
        draft: "Draft",
        "patch-notes": "Patch notes",
        schedule: "Schedule",
        games: "Match history",
        overlay: "Overlay",
        maker: "Tier list maker",
        "make-build": "Build maker",
        updates: "Updates",
        other: "Other",
      };
      const fmt = (n) => n.toLocaleString("en");
      const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "–");
      let PW = "";
      try {
        PW = localStorage.getItem("junhots_admin") || "";
      } catch {}
      let DAYS = 30;

      async function load() {
        const r = await fetch("/api/stats?days=" + DAYS, { headers: { authorization: "Bearer " + PW } }).catch(
          () => null,
        );
        if (r?.status === 401) {
          PW = "";
          try {
            localStorage.removeItem("junhots_admin");
          } catch {}
          return showLogin();
        }
        document.getElementById("login").hidden = true;
        document.getElementById("side").hidden = false;
        if (!r?.ok) {
          document.getElementById("out").innerHTML =
            `<div class="empty"><b>Couldn't load</b>Check your connection and try again.</div>`;
          return;
        }
        draw(await r.json());
      }

      function draw({ rows, today, days }) {
        const out = document.getElementById("out");
        if (!rows.length) {
          out.innerHTML = `<div class="empty"><b>No visits counted yet</b>Counting starts when this update is live. Check back tomorrow.</div>`;
          return;
        }
        const sum = (f) => rows.filter(f).reduce((a, x) => a + x.n, 0);
        const visits = sum((x) => x.kind === "visit"),
          back = sum((x) => x.kind === "visit" && x.ret);
        const views = sum((x) => x.kind === "view");
        const tw = sum((x) => x.kind === "click" && x.target.startsWith("twitch")),
          twLive = sum((x) => x.kind === "click" && x.target === "twitch-live");
        const copies = sum((x) => x.kind === "copy");
        const click = (t) => sum((x) => x.kind === "click" && x.target === t);

        // Every day in the range, oldest first, even days with nothing
        const list = [];
        for (let i = days - 1; i >= 0; i--)
          list.push(new Date(Date.parse(today) - i * 864e5).toISOString().slice(0, 10));
        const per = list.map((d) => ({
          d,
          nw: sum((x) => x.day === d && x.kind === "visit" && !x.ret),
          rt: sum((x) => x.day === d && x.kind === "visit" && x.ret),
          tw: sum((x) => x.day === d && x.kind === "click" && x.target.startsWith("twitch")),
        }));
        const max = Math.max(1, ...per.map((p) => p.nw + p.rt));
        const every = days > 31 ? 7 : days > 7 ? 3 : 1;

        // Pages: views, Twitch clicks from there, and clicks per 100 views
        const pages = Object.keys(PAGE)
          .map((p) => ({
            p,
            v: sum((x) => x.kind === "view" && x.page === p),
            t: sum((x) => x.kind === "click" && x.page === p && x.target.startsWith("twitch")),
            land: sum((x) => x.kind === "visit" && x.page === p),
            landBack: sum((x) => x.kind === "visit" && x.page === p && x.ret),
          }))
          .filter((x) => x.v || x.t || x.land)
          .sort((a, b) => b.t - a.t || b.v - a.v);
        const topT = Math.max(1, ...pages.map((x) => x.t));

        out.innerHTML = `
  <div class="tiles">
    <div class="tile"><b>${fmt(visits)}</b><span>Visitors</span><small>${fmt(views)} page views</small></div>
    <div class="tile"><b>${pct(back, visits)}</b><span>Came back</span><small>${fmt(back)} visits from people who were here before</small></div>
    <div class="tile tw"><b>${fmt(tw)}</b><span>Clicks to Twitch</span><small>${pct(tw, visits)} of visitors · ${fmt(twLive)} while live</small></div>
    <div class="tile"><b>${fmt(copies)}</b><span>Build codes copied</span><small>Discord ${fmt(click("discord"))} · YouTube ${fmt(click("youtube"))} · X ${fmt(click("x"))}</small></div>
  </div>
  <section class="box">
    <h2>Visitors per day</h2>
    <p class="sub">Each browser counts once a day. Hover a day for the numbers.</p>
    <div class="days">${per.map((p) => `<div class="day" title="${p.d}: ${p.nw + p.rt} visitors (${p.rt} came back) · ${p.tw} clicks to Twitch"><i class="nw" style="height:${(p.nw / max) * 100}%"></i><i class="rt" style="height:${(p.rt / max) * 100}%"></i></div>`).join("")}</div>
    <div class="daylab">${per.map((p, i) => `<span>${(days - 1 - i) % every ? "" : new Date(p.d + "T12:00Z").toLocaleDateString("en", { month: "short", day: "numeric" })}</span>`).join("")}</div>
    <div class="key"><span><i style="background:var(--brand)"></i>Came back</span><span><i style="background:#4a413c"></i>New</span></div>
  </section>
  <section class="box">
    <h2>Which pages send people to Twitch</h2>
    <p class="sub">Clicks on any Twitch link or button on that page (top bar, live bar, build pages, footer).</p>
    <table><thead><tr><th>Page</th><th class="n">Views</th><th>Clicks to Twitch</th><th class="n">Per 100 views</th><th class="n hide-sm">First page of a visit</th><th class="n hide-sm">…of a return visit</th></tr></thead>
    <tbody>${pages.map((x) => `<tr><td>${esc(PAGE[x.p])}</td><td class="n">${fmt(x.v)}</td><td><span class="bar" style="width:${Math.round((x.t / topT) * 90)}px"></span>${fmt(x.t)}</td><td class="n rate">${x.v ? ((x.t / x.v) * 100).toFixed(1) : "–"}</td><td class="n hide-sm">${fmt(x.land)}</td><td class="n hide-sm">${fmt(x.landBack)}</td></tr>`).join("")}</tbody></table>
  </section>
  <p class="note">No cookies and nothing personal: pages only count views and clicks. You (logged in) and browsers with "Do not track" are not counted. Cloudflare Web Analytics still has the full traffic picture (countries, referrers).</p>`;
      }

      document.querySelectorAll(".seg button").forEach((b) =>
        b.addEventListener("click", () => {
          DAYS = +b.dataset.d;
          document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
          load();
        }),
      );
      function showLogin() {
        document.getElementById("side").hidden = true;
        document.getElementById("out").innerHTML = "";
        document.getElementById("login").hidden = false;
        document.getElementById("pw").focus();
      }
      document.getElementById("login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("pw").value;
        const r = await fetch("/api/login", { method: "POST", headers: { authorization: "Bearer " + pw } }).catch(
          () => null,
        );
        if (!r?.ok) {
          document.getElementById("pwerr").hidden = false;
          return;
        }
        PW = pw;
        try {
          localStorage.setItem("junhots_admin", pw);
        } catch {}
        load();
      });
      PW ? load() : showLogin();
    </script>
  </body>
</html>
