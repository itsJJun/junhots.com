<style>
:root { --sit: #f0b429; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.seg button { font: 500 13px/1 var(--sans); color: var(--muted); height: 30px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { color: #1f0b05; background: var(--brand); }
.seg button[aria-pressed="true"] .ri { color: #1f0b05 !important; }
input[type=search], input[type=text] { font: 400 14px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; height: 38px; padding: 0 12px; min-width: 0; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.bar input { width: 240px; }
.btn2 { font: 500 13px/1 var(--sans); color: var(--text); height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn2:hover { background: var(--surface-2); }
.btn2.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Hero picker: hero art cards (falls back to the square portrait when a hero has no art yet) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 10px; }
.pick { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; aspect-ratio: 4 / 5; padding: 0 10px 9px; overflow: hidden; isolation: isolate; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: #fff; font-size: 13px; font-weight: 600; line-height: 1.2; transition: border-color .15s, transform .15s; }
.pick::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(10, 8, 7, 0.92), rgba(10, 8, 7, 0.35) 40%, transparent 62%); }
.pick .port { position: absolute; inset: 0; z-index: -2; }
.pick .port img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 14%; transition: transform .3s; }
.pick .port .rb { top: 7px; right: 7px; bottom: auto; }
.pick .nm { text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
.pick:hover { border-color: var(--brand); transform: translateY(-2px); }
.pick:hover .port img { transform: scale(1.05); }
.pick .has { color: var(--brand); font-size: 11px; font-weight: 500; line-height: 1; }
@media (prefers-reduced-motion: reduce) { .pick, .pick .port img { transition: none; } }

/* Hero page */
.back { display: inline-flex; gap: 6px; font-size: 13px; color: var(--muted); margin: 28px 0 0; }
.back:hover { color: var(--text); }
.top { padding-block: 18px 10px; position: relative; isolation: isolate; }
/* Hero art from the in-game loading screen, faded into the page behind the header */
.top .art { position: absolute; z-index: -1; right: 0; top: -30px; width: 360px; height: 420px; object-fit: cover; object-position: center top; opacity: .75; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 50%, #000 85%, transparent), linear-gradient(to bottom, transparent, #000 15%, #000 45%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 50%, #000 85%, transparent), linear-gradient(to bottom, transparent, #000 15%, #000 45%, transparent); mask-composite: intersect; }
@media (max-width: 640px) { .top .art { width: 240px; height: 300px; top: -20px; right: -16px; opacity: .3; } }
.who { display: grid; grid-template-columns: 84px 1fr; gap: 4px 18px; align-items: center; }
.who img { grid-row: span 3; width: 84px; height: 84px; border-radius: 10px; object-fit: cover; }
.who h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; }
.who .title { color: var(--muted); font-size: 14px; }
.who .role { font-size: 13px; color: var(--muted); }

h2.sec { margin: 30px 0 12px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
h2.sec small { font-size: 13px; font-weight: 400; color: var(--muted); }
h2.sec { flex-wrap: wrap; row-gap: 2px; }
h2.sec > span { white-space: nowrap; }

.builds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.bcard { padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; gap: 12px; }
.bcard .bh { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.bcard .bh b { font-size: 16px; font-weight: 600; }
.bcard .bh .by { font-size: 12px; color: var(--muted); }
.bcard .bh .btn2:first-of-type { margin-left: auto; }
.bcard .bh .btn2 + .btn2 { margin-left: -2px; }
.bcard { transition: border-color .15s, box-shadow .15s; }
.bcard.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 0 22px rgba(242, 106, 75, 0.14); }
.bcard .showing { display: none; font: 600 11px/1 var(--sans); color: #1f0b05; background: var(--brand); border-radius: 999px; padding: 4px 8px; }
.bcard.on .showing { display: inline-block; }
.bcard[data-b] { cursor: pointer; }
/* Recommended: Jun's pick for the hero. Shown first, with a coral star badge */
.bcard.rec { border-color: rgba(242, 106, 75, 0.55); background: linear-gradient(180deg, rgba(242, 106, 75, 0.07), transparent 60%), var(--surface); }
.bcard .recb { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--sans); letter-spacing: .02em; color: var(--brand); border: 1px solid rgba(242, 106, 75, 0.5); background: rgba(242, 106, 75, 0.1); border-radius: 999px; padding: 4px 8px 4px 6px; }
.bcard .recb svg { width: 12px; height: 12px; fill: currentColor; }
.bcard .btn2.recon { color: var(--brand); border-color: rgba(242, 106, 75, 0.5); }
.bcard[data-b]:hover:not(.on) { border-color: #4a413c; }
.bcard .clickhint { font-size: 12px; color: var(--muted); opacity: .7; }
.bcard.on .clickhint { display: none; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { display: grid; justify-items: center; gap: 3px; font: 500 10px var(--mono); color: var(--muted); }
.ic { position: relative; display: block; }
.empty { display: block; }
.tal .slot .lvl { margin-top: 2px; }
.tn { font: 600 11px/1 var(--mono); color: var(--brand); }
.slot .tn { margin-top: -1px; }
.code { font: 500 12px var(--mono); color: var(--muted); }
.btn2:disabled { opacity: .45; cursor: default; }
.slot img, .slot .empty { width: 40px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); }
.slot button { all: unset; cursor: pointer; border-radius: 7px; }
.slot button:focus-visible { outline: 2px solid var(--accent); }
.good { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
/* Situational swap: a second talent for a level, shown as a small amber icon on the slot */
.slot .ic .alts { position: absolute; right: -5px; bottom: -6px; display: flex; }
.slot .ic .more { position: absolute; right: -6px; bottom: -6px; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: var(--sit); color: #1a1300; font: 700 11px/22px var(--mono); text-align: center; box-shadow: 0 0 0 2px var(--surface); }
.mine .slot .ic .more { box-shadow: 0 0 0 2px #1a1716; }
.slot .ic .alt { position: relative; width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--sit); box-shadow: 0 0 0 2px var(--surface); background: var(--surface-2); }
.mine .slot .ic .alt { width: 20px; height: 20px; box-shadow: 0 0 0 2px #1a1716; }
.strip:has(.alt) .lvl { margin-top: 6px; }
.slot .tn i { font-style: normal; color: var(--sit); }
.sit { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.sit .lab::before, .sitkey::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; border: 1.5px solid var(--sit); margin-right: 7px; vertical-align: 0; }
.sit .chip { cursor: pointer; font: inherit; color: var(--text); }
.sit .chip:hover { border-color: var(--sit); }
.sitbox { display: grid; gap: 6px; }
.sitrow { display: grid; grid-template-columns: 48px 1fr; align-items: center; }
.sitrow .sl { font: 500 11px var(--mono); color: var(--muted); }
.good .lab::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 7px; vertical-align: 1px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 3px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--text); }
.chip img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }
.chip button { all: unset; cursor: pointer; color: var(--muted); padding-left: 2px; }
/* "Take it vs": the heroes this build is made for, as small faces (name on hover) */
.takevs .faces { display: flex; gap: 4px; flex-wrap: wrap; }
.takevs .faces img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }
.takevs .faces img:hover { border-color: var(--good); }
.takevs.with .lab::before { background: var(--accent); }
.takevs.with .faces img:hover { border-color: var(--accent); }
.bcard .takevs + .takevs { margin-top: -6px; }
.good.with .lab::before { background: var(--accent); }
.note { font-size: 13.5px; line-height: 1.55; color: var(--text); margin: 0; white-space: pre-line; }
/* Level notes: "Lvl 13: ..." lines of a build's note, shown per level and as a small coral dot on that level's icon */
.lnotes { display: grid; gap: 6px; }
.lnotes .lab { font-size: 12px; color: var(--muted); }
.lnotes .lab::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-right: 7px; vertical-align: 0; }
.lngrid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; align-items: baseline; font-size: 13px; line-height: 1.5; color: #b9b1ab; white-space: pre-line; }
.lngrid .sl { font: 600 11px var(--mono); color: var(--brand); white-space: nowrap; }
.slot .ic .ndot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface); }
.tip .tnote { margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: #1d1a18; border: 1px solid var(--brand); font-size: 12.5px; line-height: 1.5; color: #cdc6c1; white-space: pre-line; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); }
.tip .tnote b { color: var(--brand); font-weight: 600; }
/* A talent named in a note: small icon + the name, hover shows the talent, tap jumps to it */
.tlink { white-space: nowrap; color: var(--text); font-weight: 600; cursor: pointer; border-bottom: 1px dotted #5a4f49; }
.tlink img { width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 5px; box-shadow: 0 0 0 1px #3d3531; }
.tlink:hover { color: var(--brand); border-bottom-color: var(--brand); }
a.hlink { text-decoration: none; }
.hlink img { border-radius: 50%; object-fit: cover; }
.tfound { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); }
.tfound .tlink { font-size: 12px; font-weight: 500; }
.tfounds { display: grid; gap: 4px; }
.tfound .fl { width: 56px; }
.tlink .xh { width: 14px; height: 14px; margin: 0 0 0 4px; border-radius: 50%; vertical-align: -2px; box-shadow: none; opacity: .85; }
.tip .tfrom { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; padding: 4px 9px 4px 4px; border-radius: 6px; background: #1d1a18; border: 1px solid #3d3531; font-size: 12px; color: var(--muted); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
.tip .tfrom img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
.tlink.pk img { box-shadow: 0 0 0 1.5px var(--brand); }
.tlink.st img { box-shadow: 0 0 0 1.5px var(--sit); }
.tlink .k { margin-left: 4px; padding: 0 4px; border-radius: 4px; border: 1px solid #3d3531; font: 600 10px/15px var(--mono); color: var(--muted); vertical-align: 1px; }
.tip .hname .ht { margin-left: 8px; font-weight: 500; color: var(--muted); }
.tip .hname .ht b { font-weight: 700; }
.none { color: var(--muted); font-size: 14px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; }

#tiers { scroll-margin-top: 60px; }
.tier { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.tier .lvl { font: 600 13px var(--mono); color: var(--muted); padding-top: 12px; text-align: center; }
.tier .lvl b { display: block; font: 700 20px/1.1 var(--sans); color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px 10px; padding-top: 6px; }
.talw { position: relative; display: grid; }
.altbtn { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; top: -9px; right: 12px; height: 19px; padding: 0 8px; border-radius: 10px; font: 600 10.5px/17px var(--sans); color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
.altbtn:hover { color: var(--sit); border-color: var(--sit); }
.altbtn[aria-pressed="true"] { color: #1a1300; background: var(--sit); border-color: var(--sit); }
.tal.isalt { border-color: var(--sit); box-shadow: 0 0 0 1px var(--sit), 0 0 18px rgba(240, 180, 41, 0.15); }
.tal { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-content: start; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); transition: border-color .12s, box-shadow .12s; }
.tal:hover { border-color: #4a413c; }
.tal .ic { grid-row: span 2; align-self: start; }
.tal img { display: block; width: 44px; height: 44px; border-radius: 8px; }
.tal .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.3; }
.key { font: 500 10px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.tal .meta { font-size: 11px; color: var(--muted); }
.tal .tx { grid-column: 1 / -1; font-size: 13px; line-height: 1.55; color: #cdc6c1; margin-top: 4px; }
.tal[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 0 18px rgba(242, 106, 75, 0.18); }
.tal.flash { animation: flash 1.2s ease-out; }
.tier.picked .tal:not([aria-pressed="true"]):not(.isalt) { opacity: .5; }
.tier.picked .tal:not([aria-pressed="true"]):not(.isalt) img { filter: grayscale(1); }
.tier.picked .tal:not([aria-pressed="true"]):not(.isalt):hover { opacity: 1; }
.tier.picked .tal:not([aria-pressed="true"]):not(.isalt):hover img { filter: none; }
.tier .tal, .tier .tal img { transition: opacity .2s, filter .2s, border-color .12s, box-shadow .12s; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--good), 0 0 22px rgba(95, 207, 143, 0.35); } }
.tx b.n { font: 500 12.5px var(--mono); color: #bfd4fd; }
.tx b.n[data-s] { color: #8fd1ff; }
.tx b.q { color: #e4b800; font-weight: 600; }
.tx b.h { color: #e6dfda; font-weight: 600; }
/* Ability row under the hero name: small chips, tap one to read it */
/* Matchups from Jun's tier list: three short rows of small portraits under the abilities */
.mu { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 18px; }
.mu:empty { display: none; }
.mug { display: grid; gap: 7px; }
.mug .lab { font-size: 12px; color: var(--muted); }
.mug .lab::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--c); }
.mug .ps { display: flex; gap: 5px; flex-wrap: wrap; }
.mug a { display: block; position: relative; border-radius: 7px; transition: transform .12s; }
.mug a img { display: block; width: 34px; height: 34px; border-radius: 7px; object-fit: cover; border: 1px solid var(--line); }
.mug a:hover { transform: translateY(-2px); }
.mug a:hover img { border-color: var(--c); }
/* A style tag in a matchup row ("Strong against Dive"): a pill with the word, hover lists the heroes with that tag */
.mug .tagp { --t: var(--c); display: inline-flex; align-items: center; gap: 7px; height: 34px; box-sizing: border-box; padding: 0 13px 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; cursor: default;
  background: linear-gradient(90deg, color-mix(in srgb, var(--t) 22%, var(--surface-2)), var(--surface-2) 85%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--t) 35%, transparent); transition: transform .12s; }
.mug .tagp:hover { transform: translateY(-2px); }
.mug .tagp .ti { width: 17px; height: 17px; flex: none; }
.mug .tagp[hidden] { display: none; }
.tip .hname.tagl { max-width: 320px; font-weight: 400; color: var(--muted); line-height: 1.5; }
.tip .hname.tagl b { color: var(--text); font-weight: 600; }
.mug .more { all: unset; cursor: pointer; height: 34px; min-width: 34px; box-sizing: border-box; padding: 0 6px; border-radius: 7px; border: 1px dashed var(--line); font: 600 11px/32px var(--mono); color: var(--muted); text-align: center; }
.mug .more:hover { color: var(--text); border-color: var(--c); }
/* Wide screens: matchups fill the empty space between the hero name and the hero art */
@media (min-width: 900px) {
  .top { display: grid; grid-template-columns: auto 1fr; column-gap: 0; }
  .top > .who, .top > .abrow { grid-column: 1; }
  .top > .abinfo { grid-column: 1 / -1; }
  .top > .mu { grid-column: 2; grid-row: 1 / span 2; align-self: center; flex-direction: column; gap: 14px; margin: 0 0 0 56px; padding-left: 28px; border-left: 1px solid var(--line); max-width: 300px; }
  .top > .mu .ps { flex-wrap: nowrap; }
}
.who .role .tierx { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); }
.who .role .tierx b { color: var(--text); font-weight: 600; }
.who .role .wrx b { font: 500 13px var(--mono); }
.abrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.ab { all: unset; box-sizing: border-box; cursor: pointer; display: grid; justify-items: center; gap: 4px; font: 600 11px/1 var(--mono); color: var(--muted); }
.ab img { display: block; width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--line); transition: border-color .12s, box-shadow .12s; }
.ab:hover img { border-color: #4a413c; }
.ab:focus-visible img { outline: 2px solid var(--accent); }
.ab[aria-expanded="true"] { color: var(--brand); }
.ab[aria-expanded="true"] img { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 0 14px rgba(242, 106, 75, 0.2); }
@media (max-width: 480px) { .abrow { gap: 7px; } .ab img { width: 40px; height: 40px; } }
.abinfo { margin-top: 10px; max-width: 640px; }
.abinfo .tal { cursor: default; width: 100%; }
.abinfo .tal:hover { border-color: var(--line); }
/* Hover info (mouse only): the full ability or talent card floats next to what you point at */
.tip { position: fixed; z-index: 40; width: min(380px, calc(100vw - 24px)); pointer-events: none; animation: tipin .1s ease-out; }
.tip .tal { cursor: default; width: 100%; background: #1d1a18; border-color: #3d3531; box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6); }
.tip .tsit { margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: #1d1a18; border: 1px solid var(--sit); font-size: 12px; color: var(--muted); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); }
.tip .hname { display: inline-block; padding: 5px 9px; border-radius: 6px; background: #1d1a18; border: 1px solid #3d3531; font-size: 12px; font-weight: 600; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
.tip .tsit b { color: var(--sit); font-weight: 600; }
@keyframes tipin { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .tip { animation: none; } }
/* Build maker ("Make your own" > Build): Jun's builds folded into one line above the talents */
.junfold { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.junfold summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; }
.junfold summary::-webkit-details-marker { display: none; }
.junfold summary small { font-weight: 400; color: var(--muted); }
.junfold summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); transition: transform .15s; }
.junfold[open] summary::after { transform: rotate(-135deg); }
.junfold .builds { padding: 0 12px 12px; }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }

/* Your build bar */
.mine { position: sticky; bottom: 0; z-index: 10; margin-top: 24px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border: 1px solid #3d3531; border-bottom: 0; border-radius: 12px 12px 0 0; background: rgba(26, 23, 22, 0.96); backdrop-filter: blur(8px); box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.45); display: grid; grid-template-columns: auto 1fr auto; gap: 10px 16px; align-items: center; }
.mine .lab { font-size: 13px; font-weight: 600; }
.mine .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.mine .slot img, .mine .slot .empty { width: 34px; height: 34px; }
.mine .rowx { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mine .rowx input[type=text] { width: 200px; height: 34px; }
.mine .rowx input[list] { width: 170px; height: 34px; }
.junlogin { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.junlogin button { all: unset; cursor: pointer; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.junlogin button:hover { color: var(--text); }
.rowx.admin { padding-top: 10px; border-top: 1px dashed #3d3531; }
.rowx.admin { align-items: flex-start; }
.rowx.admin .notebox { flex: 1; min-width: 220px; display: grid; gap: 6px; }
.rowx.admin textarea { box-sizing: border-box; width: 100%; min-height: 60px; max-height: 180px; resize: vertical; font: 400 13px/1.5 var(--sans); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.rowx.admin textarea:focus { outline: none; border-color: var(--brand); }
.lvlbtns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); }
.lvlbtns button { all: unset; cursor: pointer; font: 500 11px/20px var(--mono); padding: 0 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.lvlbtns button:hover { color: var(--text); border-color: var(--brand); }
.lvlbtns button.has { color: #1f0b05; background: var(--brand); border-color: var(--brand); }
.btn2.save { background: var(--brand); border-color: var(--brand); color: #1f0b05; font-weight: 600; }
dialog { width: min(400px, calc(100% - 32px)); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
dialog p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
dialog input { width: 100%; font: 400 14px var(--sans); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; height: 38px; padding: 0 12px; }
dialog .err { color: var(--bad); margin: 8px 0 0; }
dialog .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 10px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 30; }
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr; }
  .tier { grid-template-columns: 1fr; gap: 6px; }
  .tier .lvl { text-align: left; padding: 0; }
  .tier .lvl b { display: inline; margin-left: 6px; }
  .mine { position: static; grid-template-columns: 1fr; border-bottom: 1px solid #3d3531; border-radius: 12px; box-shadow: none; }
  .bar input { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .tal.flash { animation: none; } }
</style>

  <script>/* coral line under the current tab (site.css .tab-ind; nav.js keeps it in place) */{const t=document.querySelector(".tabs"),a=t&&t.querySelector('[aria-current="page"]');if(a){const i=document.createElement("span");i.className="tab-ind";i.setAttribute("aria-hidden","true");i.style.cssText=`left:${a.offsetLeft}px;width:${a.offsetWidth}px`;t.append(i)}}</script>

<script src="/site.js"></script>
<script>
// Hero data: /data/heroes/<id>.json (talents and abilities from the game files, made by tools/update_builds_data.py).
// Jun's builds: /api/builds (saved in Cloudflare by Jun's editor, see src/worker.js), falling back to /data/builds.json. "picks" = which talent was taken on each row, counting from 1 (0 = none).
const LEVELS = ["1", "4", "7", "10", "13", "16", "20"];
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const portrait = id => `/img/heroes/${id}.webp`;
const icon = n => `/img/talents/${n}.webp`;
// Abilities show in the in-game bar order: Q W E, heroics, then the trait (D).
const ORDER = ["Q", "W", "E", "R", "D"];
const KEY = { Passive: "Passive", Active: "Active", D: "Trait", R: "Heroic" };
// Builds a visitor saves live only in their own browser (localStorage), per hero.
let MYB = {}; try { MYB = JSON.parse(localStorage.getItem("junhots_mybuilds") || "{}"); } catch {}
const saveMYB = () => { try { localStorage.setItem("junhots_mybuilds", JSON.stringify(MYB)); return true; } catch { return false; } };
let ADMIN = ""; try { ADMIN = localStorage.getItem("junhots_admin") || ""; } catch {}
// Share links look like /builds/jaina?b=... so Discord and X show that hero's picture (the server fills in the preview).
// The page itself works with #jaina, so turn the address back into that.
{ const m = location.pathname.match(/^\/builds\/([a-z0-9]+)\/?$/); if (m) history.replaceState(null, "", `/builds/#${m[1]}${location.search ? "?" + location.search.slice(1) : ""}`); }
// "Make your own" > Build opens this page as /builds/?make: same page, talents first.
const MAKE = new URLSearchParams(location.search).has("make");
let HEROES = [], byId = {}, BUILDS = {}, role = "All", hero = null, mine = null;

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function heroChip(id, removable, kind = "good") {
  const h = byId[id]; if (!h) return "";
  return `<span class="chip"><img src="${portrait(id)}" alt="">${esc(h.name)}${removable ? `<button data-un${kind}="${id}" aria-label="Remove ${esc(h.name)}">×</button>` : ""}</span>`;
}

// ---------- hero list ----------
function renderList() {
  document.title = MAKE ? "Make a Heroes of the Storm build · JunHotS" : "Heroes of the Storm builds and talents · JunHotS";
  app.innerHTML = `
    <header class="page-head"><div>${MAKE ? `<h1>Make a build</h1>
      <p class="sub">Pick a hero, then click one talent per level. Copy the build code into the game or share the link.</p>` : `<h1 data-edit="builds_title">Builds</h1>
      <p class="sub" data-edit="builds_text">Talents and abilities for every hero. See my builds, copy them into the game, or make your own and share it.</p>`}</div></header>
    <div class="bar">
      <div class="seg" role="group" aria-label="Role">${["All", ...ROLES].map(r => `<button class="rtab" data-role="${r}" aria-pressed="${r === role}" title="${r}">${roleIcon(r)}${ROLE_SHORT(r)}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search heroes" aria-label="Search heroes">
    </div>
    <div class="grid" id="grid"></div>`;
  applyText();
  const draw = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    document.getElementById("grid").innerHTML = HEROES.filter(h => (role === "All" || h.grole === role) && h.name.toLowerCase().includes(q))
      .map(h => `<a class="pick" href="#${h.id}"><span class="port"><img src="/img/art/${h.id}.webp" alt="" loading="lazy" onerror="this.onerror=null;this.src='${portrait(h.id)}'">${roleIcon(h.grole, "rb")}</span><span class="nm">${esc(h.name)}</span>${BUILDS[h.id]?.length ? `<span class="has">${BUILDS[h.id].length} build${BUILDS[h.id].length > 1 ? "s" : ""}</span>` : ""}</a>`).join("");
  };
  document.getElementById("q").addEventListener("input", draw);
  app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { role = b.dataset.role; app.querySelectorAll("[data-role]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  draw();
}

// ---------- hero page ----------
async function openHero(id, state) {
  if (!hero || hero.id !== id) hero = await fetch(`/data/heroes/${id}.json`).then(r => r.json());
  loadGames(id);
  await loadOthers([...(BUILDS[id] || []), ...(MYB[id] || []), state].flatMap(linkedHeroes));   // so other heroes' talents in notes get icons
  mine = { picks: [0, 0, 0, 0, 0, 0, 0], name: "", good: [], with: [], ...state };
  mine.alt = noAlt().map((_, r) => alts(mine.alt?.[r]).filter(a => a !== mine.picks[r] && hero.talents[LEVELS[r]]?.[a - 1]).join(""));
  document.title = `${hero.name} build and talents · JunHotS`;
  const jun = BUILDS[id] || [];
  const you = MYB[id] || [];
  const junHtml = jun.length ? `<div class="builds">${jun.map((b, i) => [b, i]).sort((x, y) => !!y[0].rec - !!x[0].rec).map(([b, i]) => buildCard(b, "jun-" + i)).join("")}</div>` : `<div class="none">No build from Jun for ${esc(hero.name)} yet. Make your own below.</div>`;
  const youHtml = `<h2 class="sec"><span>Your saved builds</span> <small>Kept in this browser on this device. Use Copy share link to keep one anywhere.</small></h2>
    ${you.length ? `<div class="builds">${you.map((b, i) => buildCard(b, "you-" + i)).join("")}</div>` : `<div class="none">Nothing saved for ${esc(hero.name)} yet. Make a build below, name it and press Save.</div>`}`;
  app.innerHTML = `
    <a class="back" href="#">← All heroes</a>
    <section class="top">
      <img class="art" src="/img/art/${id}.webp" alt="" onerror="this.remove()">
      <div class="who"><img src="${portrait(id)}" alt=""><h1>${esc(hero.name)}</h1><div class="title">${esc(hero.title)}</div><div class="role">${roleIcon(byId[id].grole)} ${esc(byId[id].grole)}<span id="tierx"></span></div></div>
      <div class="abrow">${hero.abilities.map((a, i) => [a, i]).sort((x, y) => ORDER.indexOf(x[0].key) - ORDER.indexOf(y[0].key)).map(([a, i]) => `<button class="ab" data-ab="${i}" data-tip="a-${i}" aria-expanded="false" aria-label="${esc(a.name)}"><img src="${icon(a.icon)}" alt="">${a.key}</button>`).join("")}</div>
      <div class="abinfo" id="abinfo" hidden></div>
      <div class="mu" id="mu"></div>
    </section>

    ${MAKE ? (jun.length ? `<details class="junfold"><summary>Jun's builds <small>${jun.length} for ${esc(hero.name)}, tap to look or start from one</small></summary>${junHtml}</details>` : "") : `<h2 class="sec">Jun's builds</h2>${junHtml}`}
    ${!MAKE || you.length ? youHtml : ""}

    <h2 class="sec"><span>${MAKE ? "Make your build" : "Talents"}</span> <small>Click one talent per level to make your build. Tap <span class="sitkey">Situational</span> on other talents in the same level to mark them as swaps. Light blue numbers grow with level.</small></h2>
    <div id="tiers">${LEVELS.map((L, r) => `
      <div class="tier" data-tier="${r}"><div class="lvl">Level<b>${L}</b></div><div class="cards">${(hero.talents[L] || []).map((t, i) => `<div class="talw">${card(t, `data-row="${r}" data-i="${i + 1}" aria-pressed="false"`, "button", i + 1)}<button class="altbtn" data-alt="${r}-${i + 1}" aria-pressed="false" title="Situational: take this instead of your pick when the game calls for it" hidden>Situational</button></div>`).join("")}</div></div>`).join("")}</div>

    <div class="mine" id="mine"></div>`;
  app.querySelectorAll(".ab").forEach(b => b.onclick = () => {
    const box = document.getElementById("abinfo"), open = b.getAttribute("aria-expanded") === "true";
    app.querySelectorAll(".ab").forEach(x => x.setAttribute("aria-expanded", "false"));
    box.hidden = open;
    if (!open) { b.setAttribute("aria-expanded", "true"); box.innerHTML = card(hero.abilities[b.dataset.ab], "", "div"); box.querySelectorAll(".tx b.n[data-s]").forEach(n => n.title = `Grows ${Math.round(n.dataset.s * 100)}% per level`); }
  });
  app.querySelectorAll(".tx b.n[data-s]").forEach(b => b.title = `Grows ${Math.round(b.dataset.s * 100)}% per level`);
  drawMine();
  drawMatchups();
}
// Tier, win rate, counters and synergy from Jun's tier list (same data as the Tier list page). Loads after the page, never holds it up.
let TL = null;
const tlReady = (window.loadTierlist ? loadTierlist() : Promise.reject()).then(d => { TL = d; if (hero) drawMatchups(); }).catch(() => {});
// My own record on this hero, from the games the overlay sends (/api/games?hero=…, only this hero's games).
// Shown next to the tier once I've played it.
let GAMES = null, gamesFor = "";
function loadGames(id) {
  if (gamesFor === id) return;
  gamesFor = id; GAMES = null;
  fetch(`/api/games?hero=${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : Promise.reject()).then(d => { if (gamesFor === id) { GAMES = d.games || []; if (hero) drawMatchups(); } }).catch(() => {});
}
function drawMatchups() {
  const box = document.getElementById("mu"), tx = document.getElementById("tierx");
  if (!box || !TL || !hero) return;
  const id = tierKey(hero.id), c = TL.counters || {}, sy = TL.synergy || {};   // Gall's page shows Cho'gall's tier
  const t = TL.tiers?.find(x => x.id === TL.overall?.[id]), wr = TL.winrates?.rates?.[id]?.wr;
  tx.innerHTML = (t ? `<span class="tierx"><b>${esc(t.name)}</b> tier</span>` : "")
    + (wr != null ? `<span class="tierx wrx">Win rate <b style="color:${wr >= 51 ? "var(--good)" : wr < 49 ? "var(--bad)" : "var(--text)"}">${wr.toFixed(1)}%</b></span>` : "")
    + ((mine => mine.length ? `<span class="tierx wrx" title="My games on ${esc(hero.name)}, sent by the stream overlay">My games <b style="color:var(--good)">${mine.filter(g => g.result === "win").length}</b>–<b style="color:var(--bad)">${mine.filter(g => g.result !== "win").length}</b></span>` : "")((GAMES || []).filter(g => g.hero === hero.id)));
  const groups = [
    ["Strong against", "var(--good)", c[id] || []],
    ["Weak against", "var(--bad)", Object.keys(c).filter(a => c[a].includes(id))],
    ["Good with", "var(--accent)", [...new Set([...(sy[id] || []), ...Object.keys(sy).filter(a => sy[a].includes(id))])]],
  ].map(([lab, col, ids]) => [lab, col, [...ids.filter(h => byId[h]), ...ids.filter(isTag)]]).filter(g => g[2].length);   // heroes first, then tags
  // Up to 6 per row; "+N" opens the rest, so a long list never takes over the page.
  box.innerHTML = groups.map(([lab, col, ids]) => `<div class="mug" style="--c:${col}"><span class="lab">${lab}</span><span class="ps">${ids.map((h, i) => {
    const hide = i >= 6 && ids.length > 7 ? " hidden" : "";
    return isTag(h) ? `<span class="tagp" style="--t:${tagColor(TL, h)}" data-tip="g-${esc(h.slice(4))}"${hide}>${tagIcon(TL, h)}${esc(tagLabel(TL, h))}</span>`
      : `<a href="#${h}" data-tip="h-${h}" aria-label="${esc(byId[h].name)}"${hide}><img src="${portrait(h)}" alt="" loading="lazy"></a>`;
  }).join("")}${ids.length > 7 ? `<button class="more" data-muall>+${ids.length - 6}</button>` : ""}</span></div>`).join("");
  box.querySelectorAll("[data-muall]").forEach(b => b.onclick = () => { b.parentNode.querySelectorAll("[hidden]").forEach(a => a.hidden = false); b.remove(); });
}
// A saved build: Jun's ("jun-0") or one the visitor saved in this browser ("you-0"). Click anywhere on it to show it on the talents.
function buildCard(b, key) {
  const [kind, i] = key.split("-");
  const btns = kind === "you" ? `<button class="btn2" data-del-you="${i}">Delete</button>`
    : ADMIN ? `<button class="btn2${b.rec ? " recon" : ""}" data-rec-jun="${i}" title="${b.rec ? "Stop recommending this build" : "Mark as recommended: shown first with a badge"}">${b.rec ? "★ Recommended" : "☆ Recommend"}</button><button class="btn2" data-edit-jun="${i}">Edit</button><button class="btn2" data-del-jun="${i}">Delete</button>` : "";
  return `
      <div class="bcard${kind === "jun" && b.rec ? " rec" : ""}" data-b="${key}">
        <div class="bh"><b>${esc(b.name)}</b>${kind === "jun" && b.rec ? `<span class="recb" title="Jun's recommended build for this hero"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>Recommended</span>` : ""}${kind === "you" ? `<span class="by">by you</span>` : ""}<span class="showing">On the talents below</span><button class="btn2 primary" data-code="${key}">Copy build code</button>${btns}</div>
        <div class="strip">${strip(b.picks, true, b.alt, splitNote(b.note).lv)}</div>
        <code class="code">${esc(code(b.picks))}</code>
        ${sitRow(b.alt)}
        ${faces("Take it vs", b.good)}${faces("Take it with", b.with, "with")}
        ${noteHtml(b.note, b)}
        <span class="clickhint">Click or tap the card to show it on the talents</span>
      </div>`;
}
const buildOf = key => { const [kind, i] = key.split("-"); return (kind === "you" ? MYB : BUILDS)[hero.id]?.[+i]; };
function card(t, attrs, tag = "button", no) {
  return `<${tag} class="tal" ${attrs}><span class="ic"><img src="${icon(t.icon)}" alt="" loading="lazy"></span><div class="nm">${no ? `<span class="tn">#${no}</span>` : ""}${esc(t.name)}<span class="key">${KEY[t.key] || t.key}</span></div><div class="meta">${esc(t.meta || "")}</div><div class="tx">${t.text}</div></${tag}>`;
}
function strip(picks, jump, alt = [], lv = {}) {
  return LEVELS.map((L, r) => {
    const t = picks[r] ? hero.talents[L]?.[picks[r] - 1] : null;
    const nums = t ? alts(alt[r]).filter(a => hero.talents[L]?.[a - 1]) : [], as = nums.map(a => hero.talents[L][a - 1]);
    const img = t ? `<img src="${icon(t.icon)}" alt="${esc(t.name)}">` : `<span class="empty"></span>`;
    // One swap: its icon on the corner. Two or more: an amber "+N" badge, so the slot stays small.
    const inner = img + (as.length === 1 ? `<span class="alts"><img class="alt" src="${icon(as[0].icon)}" alt="Situational: ${esc(as[0].name)}" data-tip="t-${r}-${nums[0]}"></span>`
      : as.length ? `<span class="more" aria-label="Situational: ${as.map(a => esc(a.name)).join(", ")}">+${as.length}</span>` : "") + (t && lv[r] ? `<span class="ndot" aria-label="Note"></span>` : "");
    return `<span class="slot"${t ? ` data-tip="t-${r}-${picks[r]}"${nums.length ? ` data-sit="${nums.join("")}"` : ""}${lv[r] ? ` data-note="${esc(lv[r])}"` : ""}` : ""}>${t && jump ? `<button data-jump="${r}-${picks[r]}" aria-label="${esc(t.name)}"><span class="ic">${inner}</span></button>` : `<span class="ic">${inner}</span>`}<span class="lvl">Lvl ${L}</span><span class="tn">${t ? picks[r] + (nums.length ? `<i>${nums.length > 2 ? " +" + nums.length : "/" + nums.join("/")}</i>` : "") : "&nbsp;"}</span></span>`;
  }).join("");
}
// "Take it vs" (enemies) / "Take it with" (allies): the heroes this build is made for, as small faces, name on hover
const faces = (lab, ids = [], cls = "") => (ids = ids.filter(g => byId[g])).length ? `<div class="good takevs ${cls}"><span class="lab">${lab}</span><span class="faces">${ids.map(g => `<img src="${portrait(g)}" alt="${esc(byId[g].name)}" data-tip="h-${g}" loading="lazy">`).join("")}</span></div>` : "";
// "Situational" row under a build: which talents to swap in, tap one to see it
function sitRow(alt = []) {

  if (!TL) return "";
  const k = tierKey(id), t = TL.tiers?.find(x => x.id === TL.overall?.[k]), wr = TL.winrates?.rates?.[k]?.wr;
  const bits = [t ? `<b style="color:${TCOL[t.color % TCOL.length]}">${esc(t.name)}</b> tier` : "", wr != null ? `<b style="color:${wr >= 51 ? "var(--good)" : wr < 49 ? "var(--bad)" : "var(--text)"}">${wr.toFixed(1)}%</b>` : ""].filter(Boolean);
  return bits.length ? `<span class="ht">${bits.join(" · ")}</span>` : "";
}
// ---------- hover info (mouse only; phones keep tap to open / tap to jump) ----------
const HOVER = matchMedia("(hover: hover) and (pointer: fine)");
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.append(tip);
function hideTip() { tip.hidden = true; tip.on = null; }
app.addEventListener("mouseover", e => {
  if (!HOVER.matches || !hero) return;
  const el = e.target.closest("[data-tip]");
  if (!el || el === tip.on) return;
  if (el.getAttribute("aria-expanded") === "true") { hideTip(); return; } // already open in the panel below
  if (el.dataset.tip.startsWith("g-")) {   // a style tag: which heroes have it
    const t = el.dataset.tip.slice(2), list = heroesWithTag(TL, t, Object.keys(byId).filter(h => !TIER_SHARED[h])).map(h => tierKey(h) === "chogall" ? "Cho'gall" : byId[h].name);
    tip.innerHTML = `<div class="hname tagl"><b>${esc(tagLabel(TL, t))}:</b> ${esc(list.join(", ") || "no heroes yet")}</div>`;
    tip.on = el; tip.hidden = false; const r = el.getBoundingClientRect(), w = tip.firstChild.offsetWidth; tip.style.left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 12)) + "px"; tip.style.top = r.bottom + 6 + "px"; return;
  }
  if (el.dataset.tip.startsWith("h-")) { const h = byId[el.dataset.tip.slice(2)]; tip.innerHTML = `<div class="hname">${esc(h.name)}${heroStats(h.id)}</div>`; tip.on = el; tip.hidden = false; const r = el.getBoundingClientRect(), w = tip.firstChild.offsetWidth; tip.style.left = Math.max(12, r.left + r.width / 2 - w / 2) + "px"; tip.style.top = r.bottom + 6 + "px"; return; }
  if (el.dataset.tip.startsWith("o-")) {   // another hero's talent named in a note
    const [, o, r, i] = el.dataset.tip.split("-"), ab = r === "a", t = ab ? OTHER[o]?.abilities[i] : OTHER[o]?.talents[LEVELS[r]]?.[i - 1];
    if (!t) return;
    tip.innerHTML = `<div class="tfrom"><img src="${portrait(o)}" alt="">${esc(byId[o].name)} ${ab ? "ability" : `talent · Level ${LEVELS[r]}`}</div>` + card(t, "", "div", ab ? 0 : +i);
    tip.on = el; tip.hidden = false;
    const rc = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(12, Math.min(rc.left + rc.width / 2 - w / 2, innerWidth - w - 12)) + "px";
    tip.style.top = (rc.bottom + 8 + h < innerHeight - 8 ? rc.bottom + 8 : Math.max(8, rc.top - h - 8)) + "px";
    return;
  }
  const [k, a, b] = el.dataset.tip.split("-"), t = k === "a" ? hero.abilities[a] : hero.talents[LEVELS[a]]?.[b - 1];
  if (!t) return;
  const sit = el.dataset.sit ? [...el.dataset.sit].map(n => hero.talents[LEVELS[a]][n - 1]?.name).filter(Boolean) : [];
  tip.innerHTML = card(t, "", "div", k === "t" ? +b : 0) + (sit.length ? `<div class="tsit"><b>Situational:</b> ${sit.map(esc).join(", ")}</div>` : "")
    + (el.dataset.note ? `<div class="tnote"><b>Jun's note:</b> ${noteText(el.dataset.note, el.closest(".bcard") && buildOf(el.closest(".bcard").dataset.b))}</div>` : "");
  tip.on = el; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 12)) + "px";
  tip.style.top = (r.bottom + 8 + h < innerHeight - 8 ? r.bottom + 8 : Math.max(8, r.top - h - 8)) + "px";
});
app.addEventListener("mouseout", e => { if (tip.on && !tip.on.contains(e.relatedTarget)) hideTip(); });
addEventListener("scroll", hideTip, { passive: true });
app.addEventListener("click", hideTip);

// ---------- Jun's editor (only shows after "Jun login"; the server checks the password) ----------
function saveJun() {
  if (!mine.name.trim()) { toast("Give the build a name first."); document.getElementById("bname").focus(); return; }
  const b = { name: mine.name.trim(), picks: [...mine.picks], alt: [...mine.alt], good: [...mine.good], with: [...mine.with], note: (mine.note || "").trim() };
  if (mine.editing != null && BUILDS[hero.id]?.[mine.editing]?.rec) b.rec = true;   // editing keeps the Recommended mark
  const list = [...(BUILDS[hero.id] || [])];
  if (mine.editing != null) list[mine.editing] = b; else list.push(b);
  putBuilds({ ...BUILDS, [hero.id]: list }, mine.editing != null ? "Updated. It's live." : "Saved. It's live for everyone.");
}
async function putBuilds(next, msg) {
  const r = await fetch("/api/builds", { method: "PUT", headers: { "content-type": "application/json", authorization: "Bearer " + ADMIN }, body: JSON.stringify(next) }).catch(() => null);
  if (r?.status === 401) { setAdmin(""); toast("Wrong password. Log in again."); return; }
  if (!r?.ok) { toast("Couldn't save. Try again in a moment."); return; }
  BUILDS = await r.json();
  const keep = window.scrollY;
  await openHero(hero.id, {}); scrollTo(0, keep);
  toast(msg);
}
function setAdmin(pw) {
  ADMIN = pw;
  try { pw ? localStorage.setItem("junhots_admin", pw) : localStorage.removeItem("junhots_admin"); } catch {}
  drawLogin(); if (hero) openHero(hero.id, mine);
}
function drawLogin() {
  const el = document.getElementById("junlogin");
  el.innerHTML = ADMIN ? `Jun editing on · <button id="logout">Log out</button>` : `<button id="login">Jun login</button>`;
  document.getElementById("logout")?.addEventListener("click", () => setAdmin(""));
  document.getElementById("login")?.addEventListener("click", () => { document.getElementById("pw").value = ""; document.getElementById("pwerr").hidden = true; document.getElementById("loginbox").showModal(); });
}
document.getElementById("loginform").addEventListener("submit", async e => {
  e.preventDefault();
  if (e.submitter?.value === "cancel") { document.getElementById("loginbox").close(); return; }
  const pw = document.getElementById("pw").value;
  const r = await fetch("/api/login", { method: "POST", headers: { authorization: "Bearer " + pw } }).catch(() => null);
  if (r?.ok) { document.getElementById("loginbox").close(); setAdmin(pw); toast("Logged in. You can now save, edit and delete your builds."); }
  else document.getElementById("pwerr").hidden = false;
});
drawLogin();

function applyText() {
  for (const el of app.querySelectorAll("[data-edit]")) { const v = (window.SITE_TEXT || {})[el.dataset.edit]; if (typeof v === "string") el.textContent = v; }
}
function route() {
  const [id, qs] = location.hash.slice(1).split("?");
  if (!id || !byId[id]) { hero = null; renderList(); return; }
  const p = new URLSearchParams(qs || ""), b = (p.get("b") || "").padEnd(7, "0").slice(0, 7);
  openHero(id, { picks: [...b].map(Number), alt: (p.get("s") || "").split("-"), name: p.get("n") || "", good: (p.get("g") || "").split(",").filter(g => byId[g]), with: (p.get("w") || "").split(",").filter(g => byId[g]) }).then(() => scrollTo(0, 0));
}
addEventListener("hashchange", route);
Promise.all([fetch("/data/heroes.json").then(r => r.json()), fetch("/api/builds", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject()).catch(() => fetch("/data/builds.json", { cache: "no-cache" }).then(r => r.json())).catch(() => ({}))]).then(([heroes, builds]) => {
  HEROES = heroes.map(([id, name, r, g]) => ({ id, name, role: r, grole: g })).sort((a, b) => a.name.localeCompare(b.name));
  HEROES.forEach(h => byId[h.id] = h);
  BUILDS = builds;
  route();
});
</script>
