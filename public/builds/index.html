<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heroes of the Storm builds and talents · JunHotS</title>
<meta name="description" content="Talent builds for every Heroes of the Storm hero: talents, abilities, Jun's builds, and your own builds to share.">
<meta property="og:title" content="Heroes of the Storm builds and talents · JunHotS">
<meta property="og:description" content="Talents and abilities for every hero, Jun's builds, and your own builds to share.">
<meta property="og:url" content="https://junhots.com/builds/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
.seg { display: flex; gap: 4px; flex-wrap: wrap; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.seg button { font: 500 13px/1 var(--sans); color: var(--muted); height: 30px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
input[type=search], input[type=text] { font: 400 14px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; height: 38px; padding: 0 12px; min-width: 0; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.bar input { width: 240px; }
.btn2 { font: 500 13px/1 var(--sans); color: var(--text); height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn2:hover { background: var(--surface-2); }
.btn2.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Hero picker */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.pick { display: grid; gap: 6px; justify-items: center; padding: 10px 6px 8px; border-radius: 10px; border: 1px solid transparent; text-align: center; font-size: 12px; }
.pick:hover { background: var(--surface); border-color: var(--line); }
.pick img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
.pick .has { color: var(--brand); font-size: 11px; line-height: 1; }

/* Hero page */
.back { display: inline-flex; gap: 6px; font-size: 13px; color: var(--muted); margin: 28px 0 0; }
.back:hover { color: var(--text); }
.top { padding-block: 18px 10px; }
.who { display: grid; grid-template-columns: 84px 1fr; gap: 4px 18px; align-items: center; }
.who img { grid-row: span 3; width: 84px; height: 84px; border-radius: 10px; object-fit: cover; }
.who h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; }
.who .title { color: var(--muted); font-size: 14px; }
.who .role { font-size: 13px; color: var(--muted); }

h2.sec { margin: 30px 0 12px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
h2.sec small { font-size: 13px; font-weight: 400; color: var(--muted); }

.builds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.bcard { padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; gap: 12px; }
.bcard .bh { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.bcard .bh b { font-size: 16px; font-weight: 600; }
.bcard .bh .by { font-size: 12px; color: var(--muted); }
.bcard .bh .btn2 { margin-left: auto; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { display: grid; justify-items: center; gap: 3px; font: 500 10px var(--mono); color: var(--muted); }
.ic { position: relative; display: block; }
.empty { display: block; }
.tal .slot .lvl { margin-top: 2px; }
.tn { font: 600 11px/1 var(--mono); color: var(--brand); }
.slot .tn { margin-top: -1px; }
.code { font: 500 12px var(--mono); color: var(--muted); }
.btn2:disabled { opacity: .45; cursor: default; }
.slot img, .slot .empty { width: 40px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); }
.slot button { all: unset; cursor: pointer; border-radius: 7px; }
.slot button:focus-visible { outline: 2px solid var(--accent); }
.good { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.good .lab::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 7px; vertical-align: 1px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 3px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--text); }
.chip img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }
.chip button { all: unset; cursor: pointer; color: var(--muted); padding-left: 2px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.none { color: var(--muted); font-size: 14px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; }

.tier { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.tier .lvl { font: 600 13px var(--mono); color: var(--muted); padding-top: 12px; text-align: center; }
.tier .lvl b { display: block; font: 700 20px/1.1 var(--sans); color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.tal { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-content: start; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); transition: border-color .12s, box-shadow .12s; }
.tal:hover { border-color: #3a3e48; }
.tal .ic { grid-row: span 2; align-self: start; }
.tal img { display: block; width: 44px; height: 44px; border-radius: 8px; }
.tal .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.3; }
.key { font: 500 10px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.tal .meta { font-size: 11px; color: var(--muted); }
.tal .tx { grid-column: 1 / -1; font-size: 13px; line-height: 1.55; color: #c3c6ce; margin-top: 4px; }
.tal[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 0 18px rgba(82, 199, 255, 0.18); }
.tal.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--good), 0 0 22px rgba(95, 207, 143, 0.35); } }
.tx b.n { font: 500 12.5px var(--mono); color: #bfd4fd; }
.tx b.n[data-s] { color: #8fd1ff; }
.tx b.q { color: #e4b800; font-weight: 600; }
.tx b.h { color: #d8dbe2; font-weight: 600; }
.abil { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.abil .tal { cursor: default; }
.abil .tal:hover { border-color: var(--line); }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }

/* Your build bar */
.mine { position: sticky; bottom: 0; z-index: 10; margin-top: 24px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border: 1px solid #2e323c; border-bottom: 0; border-radius: 12px 12px 0 0; background: rgba(18, 20, 25, 0.96); backdrop-filter: blur(8px); box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.45); display: grid; grid-template-columns: auto 1fr auto; gap: 10px 16px; align-items: center; }
.mine .lab { font-size: 13px; font-weight: 600; }
.mine .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.mine .slot img, .mine .slot .empty { width: 34px; height: 34px; }
.mine .rowx { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mine .rowx input[type=text] { width: 200px; height: 34px; }
.mine .rowx input[list] { width: 170px; height: 34px; }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 10px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 30; }
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr; }
  .tier { grid-template-columns: 1fr; gap: 6px; }
  .tier .lvl { text-align: left; padding: 0; }
  .tier .lvl b { display: inline; margin-left: 6px; }
  .mine { position: static; grid-template-columns: 1fr; border-bottom: 1px solid #2e323c; border-radius: 12px; box-shadow: none; }
  .bar input { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .tal.flash { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a class="logo" href="/">Jun<span>HotS</span></a>
    <div class="tabs"><a href="/">Home</a><a href="/tierlist/">Tier list</a><a href="/builds/" aria-current="page">Builds</a><a href="/tierlist-maker/">Make your own</a><a href="/overlay/">Overlay</a></div>
    <a class="nav-live" href="https://www.twitch.tv/junhots_" target="_blank" rel="noopener"><span class="dot"></span>Twitch</a>
  </nav>

  <main id="app"></main>

  <footer>
    <span data-edit="footer_left">© 2026 Jun · junhots.com</span>
    <span class="social"><a href="https://www.twitch.tv/junhots_" target="_blank" rel="noopener">Twitch</a><a href="https://www.youtube.com/@junhots" target="_blank" rel="noopener">YouTube</a><a href="https://x.com/junhots_" target="_blank" rel="noopener">X</a><a href="https://discord.gg/72sNc5a88b" target="_blank" rel="noopener">Discord</a></span>
    <span data-edit="footer_right">Not affiliated with Blizzard Entertainment</span>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/text.js"></script>
<script src="/site.js"></script>
<script>
// Hero data: /data/heroes/<id>.json (talents and abilities from the game files, made by tools/update_builds_data.py).
// Jun's builds: /data/builds.json. "picks" = which talent was taken on each row, counting from 1 (0 = none).
const LEVELS = ["1", "4", "7", "10", "13", "16", "20"];
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const portrait = id => `/img/heroes/${id}.webp`;
const icon = n => `/img/talents/${n}.webp`;
const KEY = { Passive: "Passive", Active: "Active", D: "Trait", R: "Heroic" };
let HEROES = [], byId = {}, BUILDS = {}, role = "All", hero = null, mine = null;

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function heroChip(id, removable) {
  const h = byId[id]; if (!h) return "";
  return `<span class="chip"><img src="${portrait(id)}" alt="">${esc(h.name)}${removable ? `<button data-ungood="${id}" aria-label="Remove ${esc(h.name)}">×</button>` : ""}</span>`;
}

// ---------- hero list ----------
function renderList() {
  document.title = "Heroes of the Storm builds and talents · JunHotS";
  app.innerHTML = `
    <header class="page-head"><div><h1 data-edit="builds_title">Builds</h1>
      <p class="sub" data-edit="builds_text">Talents and abilities for every hero. See my builds, copy them into the game, or make your own and share it.</p></div></header>
    <div class="bar">
      <div class="seg" role="group" aria-label="Role">${["All", "Tank", "Bruiser", "DPS", "Support"].map(r => `<button data-role="${r}" aria-pressed="${r === role}">${r}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search heroes" aria-label="Search heroes">
    </div>
    <div class="grid" id="grid"></div>`;
  applyText();
  const draw = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    document.getElementById("grid").innerHTML = HEROES.filter(h => (role === "All" || h.role === role) && h.name.toLowerCase().includes(q))
      .map(h => `<a class="pick" href="#${h.id}"><img src="${portrait(h.id)}" alt="" loading="lazy">${esc(h.name)}${BUILDS[h.id]?.length ? `<span class="has">${BUILDS[h.id].length} build${BUILDS[h.id].length > 1 ? "s" : ""}</span>` : ""}</a>`).join("");
  };
  document.getElementById("q").addEventListener("input", draw);
  app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { role = b.dataset.role; app.querySelectorAll("[data-role]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  draw();
}

// ---------- hero page ----------
async function openHero(id, state) {
  if (!hero || hero.id !== id) hero = await fetch(`/data/heroes/${id}.json`).then(r => r.json());
  mine = { picks: [0, 0, 0, 0, 0, 0, 0], name: "", good: [], ...state };
  document.title = `${hero.name} build and talents · JunHotS`;
  const jun = BUILDS[id] || [];
  app.innerHTML = `
    <a class="back" href="#">← All heroes</a>
    <section class="top">
      <div class="who"><img src="${portrait(id)}" alt=""><h1>${esc(hero.name)}</h1><div class="title">${esc(hero.title)}</div><div class="role">${esc(hero.role)}</div></div>
    </section>

    <h2 class="sec">Jun's builds</h2>
    ${jun.length ? `<div class="builds">${jun.map((b, i) => `
      <div class="bcard">
        <div class="bh"><b>${esc(b.name)}</b><span class="by">by Jun</span><button class="btn2 primary" data-code="${i}">Copy build code</button><button class="btn2" data-copybuild="${i}">Edit as my build</button></div>
        <div class="strip">${strip(b.picks, true)}</div>
        <code class="code">${esc(code(b.picks))}</code>
        ${b.good?.length ? `<div class="good"><span class="lab">Good vs</span>${b.good.map(g => heroChip(g)).join("")}</div>` : ""}
        ${b.note ? `<p class="note">${esc(b.note)}</p>` : ""}
      </div>`).join("")}</div>` : `<div class="none">No build from Jun for ${esc(hero.name)} yet. Make your own below.</div>`}

    <h2 class="sec">Talents <small>Click one talent per level to make your build. Light blue numbers grow with level.</small></h2>
    <div id="tiers">${LEVELS.map((L, r) => `
      <div class="tier"><div class="lvl">Level<b>${L}</b></div><div class="cards">${(hero.talents[L] || []).map((t, i) => card(t, `data-row="${r}" data-i="${i + 1}" aria-pressed="false"`, "button", i + 1)).join("")}</div></div>`).join("")}</div>

    <div class="mine" id="mine"></div>

    <h2 class="sec">Abilities</h2>
    <div class="abil">${hero.abilities.map(a => card(a, "", "div")).join("")}</div>`;
  app.querySelectorAll(".tx b.n[data-s]").forEach(b => b.title = `Grows ${Math.round(b.dataset.s * 100)}% per level`);
  drawMine();
}
function card(t, attrs, tag = "button", no) {
  return `<${tag} class="tal" ${attrs}><span class="ic"><img src="${icon(t.icon)}" alt="" loading="lazy"></span><div class="nm">${no ? `<span class="tn">#${no}</span>` : ""}${esc(t.name)}<span class="key">${KEY[t.key] || t.key}</span></div><div class="meta">${esc(t.meta || "")}</div><div class="tx">${t.text}</div></${tag}>`;
}
function strip(picks, jump) {
  return LEVELS.map((L, r) => {
    const t = picks[r] ? hero.talents[L]?.[picks[r] - 1] : null;
    const img = t ? `<img src="${icon(t.icon)}" alt="${esc(t.name)}" title="${esc(t.name)}">` : `<span class="empty"></span>`;
    const inner = img;
    return `<span class="slot">${t && jump ? `<button data-jump="${r}-${picks[r]}" aria-label="${esc(t.name)}"><span class="ic">${inner}</span></button>` : `<span class="ic">${inner}</span>`}<span class="lvl">Lvl ${L}</span><span class="tn">${t ? "#" + picks[r] : "&nbsp;"}</span></span>`;
  }).join("");
}
// In-game build code: paste it in the game chat, e.g. [T1311132,Varian]
const code = picks => `[T${picks.join("")},${hero.gameId}]`;
function copyCode(picks) {
  const c = code(picks);
  navigator.clipboard?.writeText(c).then(() => toast(`Copied ${c}. Paste it in the in-game chat.`), () => prompt("Copy this build code:", c));
}
function drawMine() {
  const box = document.getElementById("mine");
  const n = mine.picks.filter(Boolean).length;
  app.querySelectorAll(".tal[data-row]").forEach(c => c.setAttribute("aria-pressed", mine.picks[c.dataset.row] == c.dataset.i));
  box.innerHTML = `
    <div class="lab">Your build<small>${n} of 7 picked</small></div>
    <div class="strip">${strip(mine.picks)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2 primary" id="mycode"${n ? "" : " disabled"}>Copy build code</button><button class="btn2" id="share">Copy share link</button><button class="btn2" id="clear">Clear</button></div>
    <div class="rowx"${n ? "" : " hidden"}>
      <input type="text" id="bname" placeholder="Build name, like Sleep build" value="${esc(mine.name)}" maxlength="40" aria-label="Build name">
      <span class="good"><span class="lab">Good vs</span>${mine.good.map(g => heroChip(g, true)).join("")}</span>
      <input type="text" list="herolist" id="addgood" placeholder="+ Add hero" aria-label="Add a hero this build is good against">
      <datalist id="herolist">${HEROES.map(h => `<option value="${esc(h.name)}">`).join("")}</datalist>
    </div>`;
  document.getElementById("bname").oninput = e => { mine.name = e.target.value; };
  document.getElementById("addgood").onchange = e => {
    const h = HEROES.find(x => x.name.toLowerCase() === e.target.value.trim().toLowerCase());
    if (h && !mine.good.includes(h.id)) { mine.good.push(h.id); drawMine(); document.getElementById("addgood").focus(); }
    else e.target.value = "";
  };
  document.getElementById("share").onclick = () => {
    const p = new URLSearchParams({ b: mine.picks.join("") });
    if (mine.name.trim()) p.set("n", mine.name.trim());
    if (mine.good.length) p.set("g", mine.good.join(","));
    const url = `${location.origin}/builds/#${hero.id}?${p}`;
    history.replaceState(null, "", `#${hero.id}?${p}`);
    navigator.clipboard?.writeText(url).then(() => toast("Link copied. Anyone with it sees your build."), () => prompt("Copy this link:", url));
  };
  document.getElementById("mycode").onclick = () => copyCode(mine.picks);
  document.getElementById("clear").onclick = () => { mine.picks = [0, 0, 0, 0, 0, 0, 0]; mine.name = ""; mine.good = []; history.replaceState(null, "", `#${hero.id}`); drawMine(); };
}

app.addEventListener("click", e => {
  const t = e.target.closest(".tal[data-row]");
  if (t) { const r = +t.dataset.row, i = +t.dataset.i; mine.picks[r] = mine.picks[r] === i ? 0 : i; drawMine(); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const [r, i] = j.dataset.jump.split("-"); const c = app.querySelector(`.tal[data-row="${r}"][data-i="${i}"]`); c.scrollIntoView({ block: "center", behavior: "smooth" }); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); return; }
  const cb = e.target.closest("[data-copybuild]");
  if (cb) { const b = BUILDS[hero.id][+cb.dataset.copybuild]; mine.picks = [...b.picks]; mine.name = b.name + " (my version)"; mine.good = [...(b.good || [])]; drawMine(); document.getElementById("mine").scrollIntoView({ block: "end", behavior: "smooth" }); return; }
  const cc = e.target.closest("[data-code]");
  if (cc) { copyCode(BUILDS[hero.id][+cc.dataset.code].picks); return; }
  const ug = e.target.closest("[data-ungood]");
  if (ug) { mine.good = mine.good.filter(g => g !== ug.dataset.ungood); drawMine(); }
});

function applyText() {
  for (const el of app.querySelectorAll("[data-edit]")) { const v = (window.SITE_TEXT || {})[el.dataset.edit]; if (typeof v === "string") el.textContent = v; }
}
function route() {
  const [id, qs] = location.hash.slice(1).split("?");
  if (!id || !byId[id]) { hero = null; renderList(); return; }
  const p = new URLSearchParams(qs || ""), b = (p.get("b") || "").padEnd(7, "0").slice(0, 7);
  openHero(id, { picks: [...b].map(Number), name: p.get("n") || "", good: (p.get("g") || "").split(",").filter(g => byId[g]) }).then(() => scrollTo(0, 0));
}
addEventListener("hashchange", route);
Promise.all([fetch("/data/heroes.json").then(r => r.json()), fetch("/data/builds.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({}))]).then(([heroes, builds]) => {
  HEROES = heroes.map(([id, name, r]) => ({ id, name, role: r })).sort((a, b) => a.name.localeCompare(b.name));
  HEROES.forEach(h => byId[h.id] = h);
  BUILDS = builds;
  route();
});
</script>
</body>
</html>
